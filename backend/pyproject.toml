[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-learning-os-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "SQLAlchemy>=2.0,<2.1", "alembic>=1.16,<2", "PyMuPDF>=1.26,<2", "python-multipart>=0.0.20,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
